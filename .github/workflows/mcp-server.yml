name: MCP server

on:
  pull_request:
    paths:
      - "catalog.json"
      - "mcp-server/**"
      - "*/SKILL.md"
      - "*/references/**"
      - "*/examples/**"
      - "*/evals/**"
  push:
    branches: [main]
    paths:
      - "catalog.json"
      - "mcp-server/**"
      - "*/SKILL.md"
      - "*/references/**"
      - "*/examples/**"
      - "*/evals/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
